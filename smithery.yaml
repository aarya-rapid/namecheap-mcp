runtime: "container"

build:
  dockerfile: "Dockerfile"
  dockerBuildPath: "."

startCommand:
  type: "http"
  configSchema:
    type: "object"
    required:
      - NAMECHEAP_API_USER
      - NAMECHEAP_API_KEY
      - NAMECHEAP_USERNAME
      - NAMECHEAP_CLIENT_IP
      - NAMECHEAP_USE_SANDBOX
    properties:
      NAMECHEAP_API_USER:
        type: "string"
        title: "Namecheap API user"
      NAMECHEAP_API_KEY:
        type: "string"
        title: "Namecheap API key"
      NAMECHEAP_USERNAME:
        type: "string"
        title: "Namecheap account username"
      NAMECHEAP_CLIENT_IP:
        type: "string"
        title: "Whitelisted client IP"
        description: "Must match the IP whitelisted in Namecheap API settings."
      NAMECHEAP_USE_SANDBOX:
        type: "boolean"
        title: "Use sandbox?"
        description: "true = Namecheap sandbox API, false = production API."
  exampleConfig:
    NAMECHEAP_API_USER: "aaryarapid"
    NAMECHEAP_API_KEY: "nc_api_key_here"
    NAMECHEAP_USERNAME: "aaryarapid"
    NAMECHEAP_CLIENT_IP: "58.84.62.103"
    NAMECHEAP_USE_SANDBOX: true
