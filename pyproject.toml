[project]
name = "namecheap-mcp"
version = "0.1.0"
description = "MCP server for fuzzy Namecheap-style domain search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.4.0",
    "httpx>=0.27.0",
    "rapidfuzz>=3.9.0",
    "python-dotenv>=1.0.1",
    "python-whois>=0.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tell hatch where the package lives
[tool.hatch.build.targets.wheel]
packages = ["src"]
